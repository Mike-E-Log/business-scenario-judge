name: tests
on: [push]   # matches leak-scan.yml's trigger; no secrets consumed — test fixtures provision their own fake tokens
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }   # matches the pinned dev environment the requirements resolve against
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
