name: leak-scan
on: [push]   # push-only: fork PRs never receive secrets and would show a permanent red X (audit 2026-08-06)
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: positive control — detector must fire on the configured tokens
        env:
          LEAK_TOKENS: ${{ secrets.LEAK_TOKENS }}
          USERNAME: ""   # pin: defuses the scanner's USERNAME fallback so a missing secret exits 2 LOUD instead of green zero-coverage (audit 2026-08-06)
        run: python scripts/scan_leaks.py --self-test
      - name: scan full history
        env:
          LEAK_TOKENS: ${{ secrets.LEAK_TOKENS }}
          USERNAME: ""   # same pin — both steps or the fallback re-opens
        run: python scripts/scan_leaks.py .
